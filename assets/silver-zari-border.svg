<svg xmlns="http://www.w3.org/2000/svg" width="120" height="46" viewBox="0 0 120 46">
  <defs>
    <!-- Metallic Silver Zari Gradient -->
    <linearGradient id="bdrSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Warm Gold Zari Highlights -->
    <linearGradient id="bdrGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Zari Thread Shadow for woven relief -->
    <filter id="bdrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#380409" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Crimson Silk Ground under border -->
  <rect width="120" height="46" fill="#800a16"/>

  <g filter="url(#bdrShadow)">
    <!-- Top Crest Row: Miniature Arched Kalga / Paisley Flame Crests -->
    <path d="
      M 0 8 Q 5 2 10 0 Q 15 2 20 8 
      Q 25 2 30 0 Q 35 2 40 8 
      Q 45 2 50 0 Q 55 2 60 8 
      Q 65 2 70 0 Q 75 2 80 8 
      Q 85 2 90 0 Q 95 2 100 8 
      Q 105 2 110 0 Q 115 2 120 8 
      L 120 9 L 0 9 Z" 
      fill="url(#bdrSilver)"/>

    <!-- Top Beaded Zari Line -->
    <rect x="0" y="9.5" width="120" height="1.8" fill="url(#bdrSilver)"/>
    <line x1="0" y1="10.4" x2="120" y2="10.4" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="1.5, 1.5"/>

    <!-- Middle Diamond Jaali (Lattice Mesh) Band -->
    <!-- Diagonal Lattice Weave Lines -->
    <g stroke="url(#bdrSilver)" stroke-width="0.8" opacity="0.9">
      <!-- 45 deg lines -->
      <line x1="-10" y1="12" x2="14" y2="36"/>
      <line x1="10" y1="12" x2="34" y2="36"/>
      <line x1="30" y1="12" x2="54" y2="36"/>
      <line x1="50" y1="12" x2="74" y2="36"/>
      <line x1="70" y1="12" x2="94" y2="36"/>
      <line x1="90" y1="12" x2="114" y2="36"/>
      <line x1="110" y1="12" x2="134" y2="36"/>

      <!-- -45 deg lines -->
      <line x1="14" y1="12" x2="-10" y2="36"/>
      <line x1="34" y1="12" x2="10" y2="36"/>
      <line x1="54" y1="12" x2="30" y2="36"/>
      <line x1="74" y1="12" x2="50" y2="36"/>
      <line x1="94" y1="12" x2="70" y2="36"/>
      <line x1="114" y1="12" x2="90" y2="36"/>
      <line x1="134" y1="12" x2="110" y2="36"/>
    </g>

    <!-- Jaali Center Rosettes / Silver Micro Beads -->
    <g fill="url(#bdrSilver)">
      <!-- Row 1: y=18 -->
      <circle cx="2" cy="18" r="1.1"/>
      <circle cx="22" cy="18" r="1.1"/>
      <circle cx="42" cy="18" r="1.1"/>
      <circle cx="62" cy="18" r="1.1"/>
      <circle cx="82" cy="18" r="1.1"/>
      <circle cx="102" cy="18" r="1.1"/>

      <!-- Row 2: y=24 (Offset) -->
      <circle cx="12" cy="24" r="1.3" fill="url(#bdrGold)"/>
      <circle cx="32" cy="24" r="1.3" fill="url(#bdrGold)"/>
      <circle cx="52" cy="24" r="1.3" fill="url(#bdrGold)"/>
      <circle cx="72" cy="24" r="1.3" fill="url(#bdrGold)"/>
      <circle cx="92" cy="24" r="1.3" fill="url(#bdrGold)"/>
      <circle cx="112" cy="24" r="1.3" fill="url(#bdrGold)"/>

      <!-- Row 3: y=30 -->
      <circle cx="2" cy="30" r="1.1"/>
      <circle cx="22" cy="30" r="1.1"/>
      <circle cx="42" cy="30" r="1.1"/>
      <circle cx="62" cy="30" r="1.1"/>
      <circle cx="82" cy="30" r="1.1"/>
      <circle cx="102" cy="30" r="1.1"/>
    </g>

    <!-- Lower Divider Cord / Zari Braid -->
    <rect x="0" y="36.5" width="120" height="1.8" fill="url(#bdrSilver)"/>
    <line x1="0" y1="37.4" x2="120" y2="37.4" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="1.5, 1.5"/>

    <!-- Bottom Scalloped Pearl Selvedge / Lace Edge -->
    <path d="
      M 0 39 Q 3 42 6 39 Q 9 42 12 39 
      Q 15 42 18 39 Q 21 42 24 39 
      Q 27 42 30 39 Q 33 42 36 39 
      Q 39 42 42 39 Q 45 42 48 39 
      Q 51 42 54 39 Q 57 42 60 39 
      Q 63 42 66 39 Q 69 42 72 39 
      Q 75 42 78 39 Q 81 42 84 39 
      Q 87 42 90 39 Q 93 42 96 39 
      Q 99 42 102 39 Q 105 42 108 39 
      Q 111 42 114 39 Q 117 42 120 39 
      L 120 46 L 0 46 Z" 
      fill="url(#bdrSilver)"/>
      
    <!-- Tiny pearl drops at bottom scallops -->
    <g fill="#ffffff" opacity="0.95">
      <circle cx="3" cy="42" r="0.75"/>
      <circle cx="9" cy="42" r="0.75"/>
      <circle cx="15" cy="42" r="0.75"/>
      <circle cx="21" cy="42" r="0.75"/>
      <circle cx="27" cy="42" r="0.75"/>
      <circle cx="33" cy="42" r="0.75"/>
      <circle cx="39" cy="42" r="0.75"/>
      <circle cx="45" cy="42" r="0.75"/>
      <circle cx="51" cy="42" r="0.75"/>
      <circle cx="57" cy="42" r="0.75"/>
      <circle cx="63" cy="42" r="0.75"/>
      <circle cx="69" cy="42" r="0.75"/>
      <circle cx="75" cy="42" r="0.75"/>
      <circle cx="81" cy="42" r="0.75"/>
      <circle cx="87" cy="42" r="0.75"/>
      <circle cx="93" cy="42" r="0.75"/>
      <circle cx="99" cy="42" r="0.75"/>
      <circle cx="105" cy="42" r="0.75"/>
      <circle cx="111" cy="42" r="0.75"/>
      <circle cx="117" cy="42" r="0.75"/>
    </g>
  </g>
</svg>
